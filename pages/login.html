<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Ponte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/index.css">
</head>
<body>
<div class="auth">
  <aside class="auth__lado">
    <a class="brand-sm" href="../index.html">Ponte</a>
    <p>Uma candidatura bem preparada começa com quem já passou por ela.</p>
  </aside>
  <main class="auth__form">
    <form>
      <h1>Entrar</h1>
      <label>Email <input type="email" name="email" autocomplete="email" placeholder="o.teu@email.com"></label>
      <label>Senha <input type="password" name="senha" autocomplete="current-password"></label>
      <label class="check"><input type="checkbox" name="lembrar"> Manter sessão iniciada</label>
      <button class="btn" type="button">Entrar</button>
      <p class="alt"><a class="link" href="#">Esqueci a senha</a></p>
      <p class="alt">Ainda não tens conta? <a class="link" href="cadastro.html">Criar conta</a></p>
    </form>
  </main>
</div>
</body>
</html>
